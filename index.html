<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>THE ABYSS: DEFINITIVE PROTOCOL</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=MedievalSharp&display=swap" rel="stylesheet">
</head>

<body oncontextmenu="return false;">
    <div id="game-stage">
        <div id="bg-void"></div>

        <div id="hud-fixed">
            <div class="hud-left">
                <div class="stat-container">
                    <span class="stat-tag">VIT</span>
                    <div class="bar-frame">
                        <div id="hp-bar" class="fill hp-red"></div>
                    </div>
                </div>
                <div class="stat-container">
                    <span class="stat-tag">EXP</span>
                    <div class="bar-frame">
                        <div id="exp-bar" class="fill exp-blue"></div>
                    </div>
                </div>
                <div id="mission-log">⚔️ TIẾN ĐỘ: <span id="kill-count">0/5</span></div>
            </div>
            <div class="hud-right">
                <div class="val-unit">💰 <span id="gold-val">0</span></div>
                <div class="val-unit">DEPTH: <span id="depth-val">1</span></div>
            </div>
        </div>

        <div id="camera">
            <div id="world">
                <div id="player-entity">
                    <div id="sprite"></div>
                    <div id="weapon"></div>
                    <div id="atk-fx"></div>
                </div>
                <div id="platform-layer"></div>
                <div id="entity-layer"></div>
                <div id="fx-layer"></div>
            </div>
        </div>
    </div>

    <div id="gui-selection" class="overlay">
        <div class="scroll-box">
            <h1 class="fantasy-title">CHỌN LINH HỒN CHIẾN BINH</h1>
            <div class="selection-container">
                <div id="class-grid" class="grid-5x2"></div>
                <div id="detail-panel">
                    <div id="detail-content">Chọn một anh hùng để xem chỉ số...</div>
                </div>
            </div>
            <button id="launch-btn" disabled onclick="startGame()">BẮT ĐẦU HÀNH TRÌNH</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
