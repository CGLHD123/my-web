<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE ABYSS PROTOCOL</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="dark-theme">
    <button id="btn-toggle-theme" class="theme-fixed-btn"><span id="bulb-icon">💡</span></button>

    <div class="game-wrapper">
        <h1 class="glitch-title" data-text="THE ABYSS PROTOCOL">THE ABYSS PROTOCOL</h1>

        <div class="stats-panel">
            <div class="stat-item">CORE: <span id="hp-value">100</span>%</div>
            <div class="stat-item">DATA: <span id="lvl-value">01</span></div>
        </div>

        <div id="game-map">
            <div id="player">
                <div class="player-eye"></div>
            </div>
        </div>

        <div class="console-box">
            <p id="game-text">Hệ thống kích hoạt... Tọa độ: Tầng G-01. Hãy tìm lối thoát.</p>
        </div>

        <div class="controls-guide">Sử dụng <b>W A S D</b> hoặc <b>Mũi tên</b> để di chuyển</div>
    </div>

    <script src="script.js"></script>
</body>

</html>
