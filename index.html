<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>THE ABYSS: EVOLUTION</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=MedievalSharp&display=swap" rel="stylesheet">
</head>

<body oncontextmenu="return false;">
    <div id="game-stage">
        <div id="parallax-bg">
            <div class="layer bg-deep"></div>
            <div class="layer bg-mid"></div>
        </div>

        <div id="hud">
            <div class="hud-left">
                <div class="stat"><span class="lbl">VIT</span>
                    <div class="bar">
                        <div id="hp-bar" class="fill hp"></div>
                    </div>
                </div>
                <div class="stat"><span class="lbl">EXP</span>
                    <div class="bar">
                        <div id="exp-bar" class="fill exp"></div>
                    </div>
                </div>
                <div id="lvl-tag">LV. 1</div>
            </div>
            <div class="hud-right">
                <div class="gold-ui">💰 <span id="gold-val">0</span></div>
                <div class="danger-ui">DANGER: <span id="danger-val">1</span></div>
                <div class="keys-ui">[H] HELP | [B] SHOP</div>
            </div>
        </div>

        <div id="camera">
            <div id="world">
                <div id="player">
                    <div id="p-sprite"></div>
                    <div id="p-weapon"></div>
                    <div id="p-slash"></div>
                    <div id="lvl-up-fx">LEVEL UP!</div>
                </div>
                <div id="platform-layer"></div>
                <div id="entity-layer"></div>
                <div id="fx-layer"></div>
            </div>
        </div>
    </div>

    <div id="gui-select" class="overlay">
        <div class="win">
            <h1 class="f-title">CHỌN CHIẾN BINH</h1>
            <div class="sel-grid-wrap">
                <div id="class-grid"></div>
                <div id="class-info"></div>
            </div>
            <button id="start-btn" disabled onclick="startGame()">XÁC NHẬN</button>
        </div>
    </div>

    <div id="gui-help" class="overlay" style="display:none">
        <div class="win small">
            <h2>HƯỚNG DẪN</h2>
            <p>[A][D]: Di chuyển | [Space]: Nhảy</p>
            <p>[Chuột trái]: Tấn công</p>
            <p>[B]: Cửa hàng | [H]: Đóng</p>
            <button onclick="toggleGUI('gui-help')">ĐÓNG</button>
        </div>
    </div>

    <div id="gui-shop" class="overlay" style="display:none">
        <div class="win small">
            <h2 style="color:var(--gold)">CỬA HÀNG</h2>
            <div class="shop-item">
                <span>Hồi máu (100%)</span>
                <button onclick="buy('heal')">200 💰</button>
            </div>
            <div class="shop-item">
                <span>Tăng Công (+20)</span>
                <button onclick="buy('atk')">500 💰</button>
            </div>
            <button onclick="toggleGUI('gui-shop')" style="margin-top:20px">THOÁT</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
