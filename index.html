<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>THE ABYSS: FIXED PROTOCOL</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=MedievalSharp&display=swap" rel="stylesheet">
</head>

<body>
    <div id="game-stage">
        <div id="bg-black"></div>

        <div id="hud-top">
            <div class="hud-group">
                <div class="stat-line"><span>VIT</span>
                    <div class="bar">
                        <div id="hp-fill" class="fill hp"></div>
                    </div>
                </div>
                <div class="stat-line"><span>EXP</span>
                    <div class="bar">
                        <div id="exp-fill" class="fill exp"></div>
                    </div>
                </div>
            </div>
            <div id="quest-ui">📜 MISSION: <span id="quest-val">0/5</span></div>
            <div class="hud-group" style="text-align:right">
                <div id="gold-ui">💰 <span id="gold-val">0</span></div>
                <div id="lv-ui">DEPTH: <span id="danger-val">1</span></div>
            </div>
        </div>

        <div id="camera">
            <div id="world">
                <div id="player-node">
                    <div id="player-sprite"></div>
                    <div id="weapon-sprite"></div>
                    <div id="slash-fx"></div>
                </div>
                <div id="platform-layer"></div>
                <div id="entity-layer"></div>
                <div id="fx-layer"></div>
            </div>
        </div>
    </div>

    <div id="gui-select" class="overlay">
        <div class="window">
            <h2>CHỌN CHIẾN BINH</h2>
            <div class="select-layout">
                <div id="class-grid"></div>
                <div id="class-info"></div>
            </div>
            <button id="start-btn" disabled onclick="startGame()">VÀO CÕI CHẾT</button>
        </div>
    </div>

    <div id="gui-help" class="overlay" style="display:none">
        <div class="window small">
            <h3>HƯỚNG DẪN</h3>
            <p>[A][D]: Di chuyển | [Space]: Nhảy</p>
            <p>[Chuột trái]: Tấn công | [H]: Đóng</p>
            <button onclick="toggleHelp()">ĐÓNG</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
