<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>THE ABYSS PROTOCOL: DARK EDITION</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=MedievalSharp&display=swap" rel="stylesheet">
</head>

<body oncontextmenu="return false;">
    <div id="game-stage">
        <div id="bg-layers">
            <div class="bg-dark-void"></div>
            <div class="bg-wall-texture"></div>
        </div>

        <div id="hud-top-fixed">
            <div class="hud-left">
                <div class="hud-unit">
                    <span class="hud-label">VIT</span>
                    <div class="hud-bar-frame hp-frame">
                        <div id="hp-fill" class="fill hp-gradient"></div>
                    </div>
                </div>
                <div class="hud-unit">
                    <span class="hud-label">EXP</span>
                    <div class="hud-bar-frame exp-frame">
                        <div id="exp-fill" class="fill exp-gradient"></div>
                    </div>
                </div>
                <div id="quest-tag">📜 <span id="quest-desc">Searching Abyss...</span></div>
            </div>
            <div class="hud-right">
                <div class="gold-counter">💰 <span id="gold-val">0</span></div>
                <div class="floor-counter">DEPTH: <span id="danger-val">1</span></div>
                <div class="system-hints">[H] HELP | [B] SHOP</div>
            </div>
        </div>

        <div id="camera">
            <div id="world" style="display: none;">
                <div id="player-container">
                    <div id="player-sprite"></div>
                    <div id="weapon-sprite"></div>
                    <div id="melee-effect"></div>
                </div>
                <div id="platform-layer"></div>
                <div id="entity-layer"></div>
                <div id="projectile-layer"></div>
                <div id="fx-layer"></div>
            </div>
        </div>
    </div>

    <div id="gui-selection" class="overlay">
        <div class="fantasy-window">
            <h1 class="ornate-title">SELECT ARCHETYPE</h1>
            <div class="selection-grid-wrap">
                <div id="class-grid" class="class-grid"></div>
                <div id="info-side" class="info-side">Select your soul...</div>
            </div>
            <button id="start-btn" class="start-btn" disabled onclick="initGame()">ENTER THE ABYSS</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
