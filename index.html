<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>THE ABYSS PROTOCOL: PIXEL SOULS</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>

<body>
    <h1 class="game-logo">THE ABYSS PROTOCOL</h1>

    <div id="fog-mask"></div>

    <div class="ui-container">
        <div class="stats-screen">
            <div class="pixel-text">HP: <span id="stat-hp">0</span> | ATK: <span id="stat-atk">0</span></div>
            <div class="pixel-text">EXP: <span id="stat-exp">0</span>/1000</div>
        </div>
    </div>

    <div id="gui-class" class="gui-overlay">
        <div class="protocol-window">
            <div class="window-header">OPERATIVE SELECTION MENU</div>
            <div class="selection-container">
                <div class="class-grid" id="class-grid"></div>

                <div class="class-info-panel">
                    <h3 class="panel-title">SPECIFICATIONS</h3>
                    <div id="info-content">
                        <p class="blink">HOVER TO SCAN...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <main id="world">
        <div id="dungeon">
            <div id="player">
                <div id="hp-bar-inner"></div>
            </div>
            <div id="enemies-layer"></div>
            <div class="platform" style="width: 5000px; bottom: 0; left: 0;"></div>
        </div>
    </main>

    <script src="script.js"></script>
</body>

</html>
