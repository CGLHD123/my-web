<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>THE ABYSS: LEVEL & QUEST SYSTEM</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>

<body>
    <div id="game-stage">
        <div id="parallax-far"></div>
        <div id="parallax-mid"></div>

        <div id="world" style="display: none;">
            <div id="player-container">
                <div id="player-sprite">
                    <div id="weapon-visual"></div>
                </div>
                <div class="hp-label">
                    <div id="hp-fill"></div>
                </div>
            </div>
            <div id="entity-layer"></div>
            <div id="particle-layer"></div>
        </div>
    </div>

    <div class="hud-left-top">
        <div class="stat-unit">LVL: <span id="ui-lvl">1</span></div>
        <div class="exp-bar">
            <div id="exp-fill"></div>
        </div>
        <div id="quest-box">QUEST: <span id="quest-desc">Loading...</span></div>
    </div>

    <div class="hud-right-top">
        <div class="stat-unit">GOLD: <span id="ui-coin">0</span></div>
        <button class="pixel-btn" onclick="location.reload()">RESET</button>
    </div>

    <div id="gui-selection" class="overlay">
        <div class="pixel-window">
            <h2 class="title">SELECT OPERATIVE</h2>
            <div class="menu-layout">
                <div class="grid-left" id="class-grid"></div>
                <div class="info-right">
                    <div id="class-details">CHỌN NHÂN VẬT...</div>
                    <button id="start-btn" class="main-btn" disabled onclick="initGame()">INITIALIZE</button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
