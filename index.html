<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>ABYSS PROTOCOL: ULTIMATE FANTASY</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=MedievalSharp&display=swap" rel="stylesheet">
</head>

<body oncontextmenu="return false;">
    <div id="game-stage">
        <div id="bg-layers">
            <div class="bg-wall"></div>
            <div class="bg-floor"></div>
        </div>

        <div id="hud-top">
            <div id="stats-left">
                <div class="stat-bar"><span class="label">HP</span>
                    <div class="bar">
                        <div id="hp-fill" class="fill hp"></div>
                    </div>
                </div>
                <div class="stat-bar"><span class="label">EXP</span>
                    <div class="bar">
                        <div id="exp-fill" class="fill exp"></div>
                    </div>
                </div>
                <div id="quest-box">📜 <span id="quest-text">Khởi hành...</span></div>
            </div>
            <div id="stats-right">
                <div>💰 <span id="gold-val">0</span></div>
                <div>☠️ TẦNG <span id="danger-val">1</span></div>
                <div class="hint">[H] TRỢ GIÚP | [B] SHOP</div>
            </div>
        </div>

        <div id="camera">
            <div id="world" style="display: none;">
                <div id="player-container">
                    <div id="player-sprite"></div>
                    <div id="weapon-sprite"></div>
                    <div id="melee-effect"></div>
                </div>
                <div id="platform-layer"></div>
                <div id="entity-layer"></div>
                <div id="projectile-layer"></div>
                <div id="fx-layer"></div>
            </div>
        </div>
    </div>

    <div id="gui-selection" class="overlay">
        <div class="fantasy-window">
            <h1 class="title">CHỌN CHIẾN BINH</h1>
            <div class="selection-flex">
                <div id="class-grid" class="class-grid"></div>
                <div id="info-panel" class="info-panel">Chọn linh hồn...</div>
            </div>
            <button id="start-btn" class="fantasy-btn" disabled onclick="initGame()">BẮT ĐẦU</button>
        </div>
    </div>

    <div id="gui-help" class="overlay" style="display:none">
        <div class="fantasy-window small">
            <h2>HƯỚNG DẪN</h2>
            <p>[A][D]: Di chuyển | [Space]: Nhảy</p>
            <p>[Chuột trái]: Tấn công | [B]: Cửa hàng</p>
            <button class="fantasy-btn" onclick="toggleHelp()">ĐÓNG</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
