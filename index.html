<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>THE ABYSS PROTOCOL</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="dark-theme">
    <button id="btn-toggle-theme" class="theme-fixed-btn">💡 LIGHTS</button>
    <button class="open-gui-btn" onclick="toggleGUI()">HELP</button>

    <div id="gui-guide" class="gui-overlay">
        <div class="gui-content">
            <h3>PROTOCOL MANUAL</h3>
            <ul>
                <li>⚡ <b>WASD:</b> Di chuyển</li>
                <li>💡 <b>LIGHTS:</b> Chuyển hệ năng lượng</li>
                <li>🎯 <b>GOAL:</b> Vượt hầm ngục</li>
            </ul>
            <button onclick="toggleGUI()">INITIALIZE</button>
        </div>
    </div>

    <div class="game-wrapper" style="display: flex; flex-direction: column; align-items: center;">
        <h1 style="text-shadow: 0 0 20px var(--neon-main);">THE ABYSS</h1>
        <div id="dungeon-frame">
            <div id="player"></div>
        </div>
        <p id="console-output" style="margin-top: 20px; opacity: 0.7;">System Booting...</p>
    </div>

    <script src="script.js"></script>
</body>

</html>
