<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>THE ABYSS PROTOCOL</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="dark-theme">
    <div class="top-nav">
        <button id="btn-toggle-theme" class="neon-nav-btn">💡 SYSTEM LIGHT</button>
        <button class="neon-nav-btn" onclick="toggleHelp(true)">❓ HELP CENTER</button>
    </div>

    <div id="gui-welcome" class="gui-overlay">
        <div class="gui-card main-neon">
            <div class="neon-line"></div>
            <h2 class="glitch">INITIALIZING PROTOCOL</h2>
            <p>Hệ thống Abyss đã sẵn sàng điều hướng.</p>
            <button class="gui-btn" onclick="closeWelcome()">ACCESS SYSTEM</button>
        </div>
    </div>

    <div id="gui-help" class="gui-overlay" style="display: none;">
        <div class="gui-card help-neon">
            <h3>OPERATIONAL MANUAL</h3>
            <div class="help-content">
                <div class="control-item"><span>W A S D</span>
                    <p>Di chuyển hạt nhân</p>
                </div>
                <div class="control-item"><span>SPACE</span>
                    <p>Kích hoạt quét Radar</p>
                </div>
            </div>
            <button class="gui-btn secondary" onclick="toggleHelp(false)">CLOSE</button>
        </div>
    </div>

    <div class="game-content">
        <div class="status-monitor">
            <div class="scanline"></div>
            <p>CORE STABILITY: <span id="hp-percent">100%</span></p>
            <div class="energy-bar">
                <div class="energy-fill"></div>
            </div>
        </div>

        <div id="dungeon-frame">
            <div id="player"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
