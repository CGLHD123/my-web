<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>THE ABYSS PROTOCOL: PIXEL SOULS</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>

<body>
    <div id="fog-mask"></div>

    <div class="stats-screen">
        <div class="pixel-text">LVL: <span id="stat-level">1</span> | EXP: <span id="stat-exp">0</span>/1000</div>
        <div class="pixel-text">HP: <span id="stat-hp">100</span> | ATK: <span id="stat-atk">10</span></div>
        <div id="shield-status" class="pixel-text">SHIELD: READY</div>
    </div>

    <div id="gui-class" class="gui-overlay">
        <div class="pixel-border-box main-menu">
            <h2 class="pixel-title">SELECT OPERATIVE</h2>
            <div class="class-grid" id="class-grid"></div>
        </div>
    </div>

    <div id="gui-help" class="gui-overlay" style="display:none;">
        <div class="pixel-border-box help-box">
            <h3 class="pixel-title">PROTOCOL INFO</h3>
            <ul class="pixel-list">
                <li>[A][D]: DI CHUYỂN</li>
                <li>[SPACE]: NHẢY</li>
                <li>[SHIFT]: CÚI</li>
                <li>[L-CLICK]: TẤN CÔNG</li>
                <li>[R-CLICK]: KHIÊN</li>
            </ul>
            <div class="btn-group">
                <button class="pixel-btn reset" onclick="resetData()">RESET</button>
                <button class="pixel-btn close" onclick="toggleHelp(false)">CLOSE</button>
            </div>
        </div>
    </div>

    <main id="world">
        <div id="dungeon">
            <div id="player">
                <div id="hp-bar-inner"></div>
                <div class="shield-pixel"></div>
            </div>
            <div id="enemies-layer"></div>
            <div class="platform" style="width: 2500px; bottom: 0; left: 0;"></div>
        </div>
        <button class="help-trigger" onclick="toggleHelp(true)">?</button>
    </main>

    <script src="script.js"></script>
</body>

</html>
