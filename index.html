<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>THE ABYSS PROTOCOL</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
</head>

<body class="dark-theme">
    <header class="header-ui">
        <button id="btn-toggle-theme" class="neon-nav-btn">💡 LIGHTS</button>
        <h1 class="game-logo-on-map">THE ABYSS PROTOCOL</h1>
        <button class="neon-nav-btn" onclick="toggleHelp(true)">❓ HELP</button>
    </header>

    <div id="gui-class" class="gui-overlay" style="display: none;">
        <div class="gui-card main-neon">
            <h2 class="neon-title">SELECT OPERATIVE</h2>
            <div class="class-selection">
                <div class="class-box" onclick="selectClass('Scout')">
                    <h4>SCOUT</h4>
                    <p>SPD: 8 | SIZE: 14</p>
                </div>
                <div class="class-box" onclick="selectClass('Tanker')">
                    <h4>TANKER</h4>
                    <p>SPD: 3 | SIZE: 30</p>
                </div>
            </div>
        </div>
    </div>

    <main class="game-container">
        <div class="stats-panel">
            <div>CLASS: <span id="stat-class">-</span></div>
            <div>SPEED: <span id="stat-speed">0</span></div>
            <div>GOLD: <span id="stat-gold" style="color: gold;">0</span></div>
            <button onclick="resetData()" class="reset-btn">♻️ RESET DATA</button>
        </div>

        <div id="dungeon-frame">
            <div id="fog-overlay"></div>
            <div id="player"></div>

            <div id="portal-in" class="portal"></div>
            <div id="portal-out" class="portal"></div>

            <div class="dungeon-block b1"></div>
            <div class="dungeon-block b2"></div>
            <div class="dungeon-block b3"></div>

            <div id="gold-item" class="gold-coin"></div>
        </div>
    </main>

    <div id="gui-help" class="gui-overlay" style="display: none;">
        <div class="gui-card help-neon">
            <h3 class="neon-title">MANUAL</h3>
            <ul class="help-list">
                <li><b>W A S D:</b> Di chuyển</li>
                <li><b>PORTAL:</b> Đi vào vòng tròn xanh để dịch chuyển</li>
                <li><b>GOLD:</b> Thu thập vàng để tăng chỉ số</li>
            </ul>
            <button class="gui-btn" onclick="toggleHelp(false)">CLOSE</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
