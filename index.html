<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Dungeon Crawler</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="dark-theme">
    <button id="btn-toggle-theme" class="theme-fixed-btn">
        <span id="bulb-icon">💡</span>
    </button>

    <div class="game-container">
        <div class="stats-bar">
            <span>HP: <span id="hp-value" class="neon-text-red">100</span></span>
            <span>LVL: <span id="lvl-value" class="neon-text-blue">1</span></span>
        </div>

        <h1 class="neon-title">NEON DUNGEON</h1>

        <div class="story-box">
            <p id="game-text">Luồng sáng Neon xanh le lói dẫn lối bạn vào hầm ngục...</p>
        </div>

        <div class="actions" id="action-buttons">
            <button onclick="explore('left')" class="neon-button blue">Rẽ Trái</button>
            <button onclick="explore('right')" class="neon-button pink">Rẽ Phải</button>
        </div>

        <p id="status-message"></p>
        <button id="reset-btn" style="display:none;" onclick="location.reload()">Chơi lại</button>
    </div>

    <script src="script.js"></script>
</body>

</html>
