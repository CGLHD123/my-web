<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE ABYSS PROTOCOL</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="dark-theme">
    <button id="btn-toggle-theme" class="theme-fixed-btn"><span id="bulb-icon">💡</span></button>

    <div id="gui-guide" class="gui-overlay">
        <div class="gui-content">
            <h3>PROTOCOL MANUAL</h3>
            <ul>
                <li><b>W A S D / Mũi tên:</b> Di chuyển chủ thể</li>
                <li><b>💡 Bóng đèn:</b> Chuyển đổi hệ năng lượng (Theme)</li>
                <li><b>Mục tiêu:</b> Thám hiểm vùng tối hầm ngục</li>
            </ul>
            <button onclick="toggleGUI()">XÁC NHẬN</button>
        </div>
    </div>

    <button class="open-gui-btn" onclick="toggleGUI()">HELP</button>

    <div class="game-wrapper">
        <h1 class="neon-title">THE ABYSS</h1>

        <div class="status-container">
            <div class="bar-label">SYSTEM STABILITY</div>
            <div class="bar-outer">
                <div id="hp-bar" class="bar-inner"></div>
            </div>
        </div>

        <div id="dungeon-frame">
            <div id="player">
                <div class="core-light"></div>
            </div>
            <div class="wall w1"></div>
            <div class="wall w2"></div>
            <div class="wall w3"></div>
        </div>

        <div id="console-output">Hệ thống sẵn sàng. Vui lòng di chuyển...</div>
    </div>

    <script src="script.js"></script>
</body>

</html>
