<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>THE ABYSS PROTOCOL</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
</head>

<body class="dark-theme">
    <header class="header-ui">
        <button id="btn-toggle-theme" class="neon-nav-btn">💡 LIGHTS</button>
        <h1 class="game-logo">THE ABYSS PROTOCOL</h1>
        <button class="neon-nav-btn" onclick="toggleHelp(true)">❓ HELP</button>
    </header>

    <div id="gui-class" class="gui-overlay" style="display: none;">
        <div class="gui-card">
            <h2 class="neon-title">SELECT OPERATIVE</h2>
            <div class="class-selection">
                <div class="class-box" onclick="selectClass('Scout')">
                    <h4>SCOUT</h4>
                    <p>SPD: 8 | SIZE: 14</p>
                </div>
                <div class="class-box" onclick="selectClass('Tanker')">
                    <h4>TANKER</h4>
                    <p>SPD: 3 | SIZE: 28</p>
                </div>
            </div>
        </div>
    </div>

    <div id="gui-help" class="gui-overlay" style="display: none;">
        <div class="gui-card">
            <h3 class="neon-title">PROTOCOL INFO</h3>
            <ul class="help-list">
                <li><b>W A S D:</b> DI CHUYỂN</li>
            </ul>
            <button onclick="resetData()" class="reset-btn-inner">♻️ RESET CHARACTER DATA</button>
            <button class="gui-btn" onclick="toggleHelp(false)">CLOSE</button>
        </div>
    </div>

    <div class="stats-screen-corner">
        <div class="stat-item">CLASS: <span id="stat-class">-</span></div>
        <div class="stat-item">SPD: <span id="stat-speed">0</span></div>
        <div class="stat-item" style="color: gold;">GOLD: <span id="stat-gold">0</span></div>
    </div>

    <main class="game-container">
        <div id="dungeon-frame">
            <div id="fog-overlay"></div>
            <div id="player"></div>
            <div id="portal-in" class="portal"></div>
            <div id="portal-out" class="portal"></div>

            <div class="wall v-wall w1"></div>
            <div class="wall h-wall w2"></div>

            <div id="gold-item" class="gold-coin"></div>
        </div>
    </main>

    <script src="script.js"></script>
</body>

</html>
