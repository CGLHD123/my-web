<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>THE ABYSS PROTOCOL: FULL INTEGRATION</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;700&display=swap" rel="stylesheet">
</head>

<body oncontextmenu="return false;">
    <div id="game-stage">
        <div id="bg-layers">
            <div class="bg-wall-full"></div>
            <div class="bg-path-stretch"></div>
        </div>

        <div id="danger-overlay">KHU VỰC: <span id="danger-val">1</span> | <span id="time-val">00:00</span></div>

        <div id="quest-tracker">
            <div id="quest-title">📜 NHIỆM VỤ AUTO</div>
            <div id="quest-desc">ĐANG ĐỢI...</div>
            <div class="bar-bg" style="width:100%">
                <div id="quest-fill" class="fill"></div>
            </div>
        </div>

        <div id="camera">
            <div id="world" style="display: none;">
                <div id="player-container">
                    <div id="player-sprite"></div>
                    <div id="weapon-sprite"></div>
                    <div id="melee-effect"></div>
                </div>
                <div id="platform-layer"></div>
                <div id="entity-layer"></div>
                <div id="projectile-layer"></div>
                <div id="drop-layer"></div>
            </div>
        </div>
    </div>

    <div id="gui-selection" class="overlay">
        <div class="pixel-window neon-window">
            <h2 class="pixel-text neon-text">CHỌN CHIẾN BINH</h2>
            <div class="selection-flex">
                <div id="class-grid" class="class-grid-2rows"></div>
                <div id="info-box" class="neon-info-box">
                    <div id="info-content">Rê chuột để xem thông số...</div>
                </div>
            </div>
            <button id="start-btn" class="pixel-btn neon-btn" disabled onclick="initGame()">XUẤT QUÂN</button>
        </div>
    </div>

    <div id="gui-shop" class="overlay" style="display: none;">
        <div class="pixel-window shop-window neon-window">
            <h2 class="pixel-text" style="color:#ffd700">BLACK MARKET</h2>
            <div id="shop-items" class="shop-grid"></div>
            <div id="shop-stats"></div>
            <button class="pixel-btn" onclick="toggleShop()"
                style="background:#ff4444; width:100%; margin-top:15px">THOÁT (B)</button>
        </div>
    </div>

    <div id="hud" style="display:none">
        <div class="hud-group">HP <div class="bar-bg">
                <div id="hp-fill" class="fill hp"></div>
            </div>
        </div>
        <div class="hud-group">ULT <div class="bar-bg">
                <div id="ult-fill" class="fill ult"></div>
            </div>
        </div>
        <div id="stats-line">💰 <span id="gold-val">0</span> | LVL: <span id="lvl-val">1</span></div>
    </div>

    <script src="script.js"></script>
</body>

</html>
