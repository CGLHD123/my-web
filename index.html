<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE ABYSS PROTOCOL</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
</head>

<body class="dark-theme">
    <header class="header-ui">
        <button id="btn-toggle-theme" class="neon-nav-btn">💡 LIGHTS</button>
        <h1 class="game-logo">THE ABYSS PROTOCOL</h1>
        <button class="neon-nav-btn" onclick="toggleHelp(true)">❓ HELP</button>
    </header>

    <div id="gui-class" class="gui-overlay">
        <div class="gui-card main-neon">
            <h2 class="neon-title">SELECT OPERATIVE</h2>
            <div class="class-selection">
                <div class="class-box" onclick="selectClass('Scout')">
                    <h4>SCOUT</h4>
                    <p>Tốc độ: Cao<br>Kích thước: Nhỏ</p>
                </div>
                <div class="class-box" onclick="selectClass('Tanker')">
                    <h4>TANKER</h4>
                    <p>Tốc độ: Thấp<br>Kích thước: Lớn</p>
                </div>
            </div>
        </div>
    </div>

    <div id="gui-help" class="gui-overlay" style="display: none;">
        <div class="gui-card help-neon">
            <h3 class="neon-title">MANUAL</h3>
            <ul class="help-list">
                <li><b>W A S D:</b> Điều khiển hạt nhân</li>
                <li><b>VA CHẠM:</b> Rung màn hình & Bíp</li>
                <li><b>CLASS:</b> Scout (Nhanh), Tanker (Trâu)</li>
            </ul>
            <button class="gui-btn" onclick="toggleHelp(false)">QUAY LẠI</button>
        </div>
    </div>

    <main class="game-container">
        <div id="dungeon-frame" class="irregular-shape">
            <div id="player"></div>
            <div class="wall v-wall w1"></div>
            <div class="wall v-wall w2"></div>
            <div class="wall h-wall w3"></div>
            <div class="wall h-wall w4"></div>
        </div>
    </main>

    <script src="script.js"></script>
</body>

</html>
