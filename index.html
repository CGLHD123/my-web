<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>THE ABYSS PROTOCOL: ULTIMATE</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;700&display=swap" rel="stylesheet">
</head>

<body id="body-main">
    <div id="game-stage">
        <div id="parallax-far"></div>
        <div id="world" style="display: none;">
            <div id="player-container">
                <div id="player-sprite">
                    <div id="weapon-visual"></div>
                </div>
            </div>
            <div id="projectile-layer"></div>
            <div id="entity-layer"></div>
            <div id="particle-layer"></div>
        </div>
    </div>

    <div id="distance-meter">KHOẢNG CÁCH: <span id="dist-val">0</span>m</div>

    <div class="hud-left-top">
        <div class="stat-unit">CẤP: <span id="ui-lvl">1</span> | VÀNG: <span id="ui-coin">0</span></div>
        <div class="exp-container">
            <div class="label-tiny">KINH NGHIỆM (EXP)</div>
            <div class="exp-bar">
                <div id="exp-fill"></div>
            </div>
            <div class="label-tiny">SINH MỆNH (HP)</div>
            <div class="hp-bar-main">
                <div id="hp-fill-main"></div>
            </div>
        </div>
        <div id="quest-box" class="stat-unit">NHIỆM VỤ: <span id="quest-desc">DIỆT 5 QUÁI</span></div>
    </div>

    <div id="combo-meter">COMBO: <span id="combo-val">0</span></div>
    <div id="berserk-mode" style="display: none;">BERSERK!</div>

    <div id="gui-selection" class="overlay">
        <div class="pixel-window selection-window">
            <h2 class="title">CHỌN CLASS ĐỂ BẮT ĐẦU</h2>

            <div class="selection-flex">
                <div id="class-grid" class="grid-layout"></div>

                <div id="info-box" class="stats-sidebar">
                    <h3>THÔNG SỐ</h3>
                    <div id="info-content">Hãy chọn một chiến binh...</div>
                </div>
            </div>

            <button id="start-btn" class="main-btn" disabled onclick="initGame()">START</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
