<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>THE ABYSS PROTOCOL: FANTASY EDITION</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=MedievalSharp&display=swap" rel="stylesheet">
</head>

<body oncontextmenu="return false;">
    <div id="game-stage">
        <div id="bg-layers">
            <div class="bg-wall-full"></div>
            <div class="bg-path-stretch"></div>
        </div>

        <div id="ui-overlay">
            <div id="danger-level">☠️ KHU VỰC: <span id="danger-val">1</span></div>
            <div id="timer">⏳ <span id="time-val">00:00</span></div>
        </div>

        <div id="quest-log">
            <div id="quest-title">📜 THỬ THÁCH SINH TỒN</div>
            <div id="quest-desc">Đang dò tìm mục tiêu...</div>
            <div class="bar-frame">
                <div id="quest-fill" class="fill"></div>
            </div>
        </div>

        <div id="camera">
            <div id="world" style="display: none;">
                <div id="player-container">
                    <div id="player-sprite"></div>
                    <div id="weapon-sprite"></div>
                    <div id="melee-effect"></div>
                </div>
                <div id="platform-layer"></div>
                <div id="entity-layer"></div>
                <div id="projectile-layer"></div>
                <div id="fx-layer"></div>
            </div>
        </div>
    </div>

    <div id="gui-selection" class="overlay">
        <div class="fantasy-window">
            <h1 class="fantasy-title">CHỌN ANH HÙNG</h1>
            <div class="selection-container">
                <div id="class-grid" class="class-grid"></div>
                <div id="info-box" class="fantasy-info">
                    <div id="info-content">Chọn một linh hồn...</div>
                </div>
            </div>
            <button id="start-btn" class="fantasy-btn" disabled onclick="initGame()">BẮT ĐẦU HÀNH TRÌNH</button>
        </div>
    </div>

    <div id="gui-shop" class="overlay" style="display: none;">
        <div class="fantasy-window shop-window">
            <h2 class="fantasy-title" style="font-size: 1.5rem;">CỬA HÀNG RÈN ĐÚC</h2>
            <div id="shop-items"></div>
            <button class="fantasy-btn cancel" onclick="toggleShop()">QUAY LẠI (B)</button>
        </div>
    </div>

    <div id="hud" style="display:none">
        <div class="hud-stat">
            <span class="label">MÁU</span>
            <div class="bar-frame hp">
                <div id="hp-fill" class="fill hp-color"></div>
            </div>
        </div>
        <div class="hud-stat">
            <span class="label">NỘ</span>
            <div class="bar-frame ult">
                <div id="ult-fill" class="fill ult-color"></div>
            </div>
        </div>
        <div id="currency">💰 <span id="gold-val">0</span></div>
    </div>

    <script src="script.js"></script>
</body>

</html>
