<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hầm Ngục Tối | Trò Chơi Phiêu Lưu</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="game-container">
        <h1>Khám Phá Hầm Ngục</h1>
        <p id="game-text">Bạn xuất hiện ở trong một hầm ngục tối đen như mực. Mùi ẩm mốc và tiếng nước nhỏ giọt từ đâu
            đó vọng lại. Bạn chuẩn bị cho chuyến khám phá của mình.</p>

        <div class="actions">
            <button id="btn-explore">Bắt đầu khám phá</button>
            <button id="btn-toggle-theme">Chế độ Sáng/Tối</button>
        </div>

        <p id="status-message"></p>
    </div>

    <script src="script.js"></script>
</body>

</html>
